{% extends "mainpage/base_c.html" %} {% load static %} {% load crispy_forms_tags
%} {% block title %}
<title>Sweet Pants | Add Book</title>
{% endblock title %} {% block content %}

<section class="signin-page account">
  <div class="container">
    <div class="row">
      <div class="col-md-6 col-md-offset-3">
        <div class="block text-center">
          <h2>Add New Book</h2>
          <form method="post">
            {% csrf_token %}
            <div class="form-group">
              <label for="isbn">ISBN:</label>
              <input
                type="text"
                class="form-control"
                id="isbn"
                name="isbn"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">Add Book</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock content %}
